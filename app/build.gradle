plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "kotlin-kapt"
    id "dagger.hilt.android.plugin"
    id "androidx.navigation.safeargs.kotlin"
}

def gitCommitHash = "git rev-parse --verify --short HEAD".execute().text.trim()

// Load keystore properties from file for security
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.mckimquyen.reader'
    compileSdk 36
    defaultConfig {
        applicationId "com.mckimquyen.reader"
        minSdk 26
        //noinspection EditedTargetSdkVersion,OldTargetApi
        targetSdk 36
        versionCode 20260401
        versionName "2026.04.01"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Keep only major languages to reduce APK size
        resourceConfigurations += ['en', 'vi', 'zh-rCN', 'ja', 'fr', 'de']

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true"
                ]
            }
        }
    }

//    lint {
//        baseline = file("lint-baseline.xml")
//    }

    flavorDimensions.add("channel")
    productFlavors {
        dev {
            dimension "channel"
        }
        prod {
            dimension "channel"
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "APPLOVIN_SDK_KEY", "\"e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt\""
            buildConfigField "String", "APPLOVIN_BANNER_ID", "\"1c8add7db0559d0b\""
            buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", "\"c64cc20b2583e3cb\""
            buildConfigField "String", "APPLOVIN_APP_OPEN_ID", "\"4e74ffbdceb9a6cf\""
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3940256099942544/9257395921\""
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "false"
        }

        release {
            // nhớ check APPLICATION_ID trong manifest
            buildConfigField "String", "APPLOVIN_SDK_KEY", "\"e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt\""
            buildConfigField "String", "APPLOVIN_BANNER_ID", "\"1c8add7db0559d0b\""
            buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", "\"c64cc20b2583e3cb\""
            buildConfigField "String", "APPLOVIN_APP_OPEN_ID", "\"4e74ffbdceb9a6cf\""
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3612191981543807/6401478547\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3612191981543807/4529159528\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3612191981543807/4028490288\""
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "false"

            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            output.outputFileName = "RSS Cat Hub-${defaultConfig.versionName}-${gitCommitHash}.apk"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Single merged kotlinOptions block (was previously split into two)
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs = freeCompilerArgs + "-opt-in=kotlin.RequiresOptIn"
    }

    // Fix KAPT compatibility with newer Java versions
    tasks.withType(org.jetbrains.kotlin.gradle.internal.KaptGenerateStubsTask).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
    buildFeatures {
        compose true
//        viewBinding true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "/META-INF/*.kotlin_module"
            excludes += "/META-INF/DEPENDENCIES"
            excludes += "/META-INF/LICENSE*"
            excludes += "/META-INF/NOTICE*"
            excludes += "/META-INF/*.properties"
            excludes += "/META-INF/*.version"
            excludes += "/*.properties"
            excludes += "DebugProbesKt.bin"
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

