plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "kotlin-kapt"
    id "dagger.hilt.android.plugin"
    id "androidx.navigation.safeargs.kotlin"
}

def gitCommitHash = "git rev-parse --verify --short HEAD".execute().text.trim()

// Every secret (signing, ad ids, VIP keys, test-device hashes) lives in ONE private file outside this repo:
// myKeyStore/com.mckimquyen.reader/app.properties (+ keystore.jks next to it). Nothing sensitive is committed here.
// An explicit READER_PRIVATE_CONFIG_DIR wins outright: pointing it at a wrong folder must not silently fall back to another one.
def explicitPrivateDir = System.getenv("READER_PRIVATE_CONFIG_DIR")
def privateConfigDirs = (explicitPrivateDir ? [explicitPrivateDir] : [
        "/Users/loitran/AndroidStudioProjects/@mckimquyen/myKeyStore/com.mckimquyen.reader",
        "/Users/LoiTP/StudioProjects/roy/myKeyStore/com.mckimquyen.reader",
]).collect { new File(it) }
def privateConfigDir = privateConfigDirs.find { new File(it, "app.properties").exists() }
def privateProps = new Properties()
if (privateConfigDir != null) {
    new File(privateConfigDir, "app.properties").withInputStream { privateProps.load(it) }
}

// A release build must never fall back to a test id or a missing key: it stops here instead of shipping wrong ads.
// Debug/test/lint tasks stay usable on a machine without the private folder.
def releaseRequested = gradle.startParameter.taskNames.any {
    def n = it.toLowerCase()
    n.contains("release") || n.contains("bundle")
}

def privateProp = { String key ->
    def v = privateProps.getProperty(key)
    if (v == null || v.trim().isEmpty()) {
        if (releaseRequested) {
            throw new GradleException("Release build needs '${key}' in app.properties (READER_PRIVATE_CONFIG_DIR or myKeyStore/com.mckimquyen.reader)")
        }
        return ""
    }
    return v.trim()
}
// Google's public sample ids serve test ads and pay nothing. A release built with one ships zero revenue, and Log.e is stripped by R8 so nothing
// would say so at run time. The build stops instead. A device test of a release build (R8 check on a phone) passes -PallowTestAdIds=true on purpose;
// a build that goes to the store never does.
def allowTestAdIds = providers.gradleProperty("allowTestAdIds").getOrElse("false") == "true"
def GOOGLE_TEST_PUBLISHER = "3940256099942544"
def releaseAdId = { String key ->
    def v = privateProp(key)
    if (releaseRequested && !allowTestAdIds && v.contains(GOOGLE_TEST_PUBLISHER)) {
        throw new GradleException("Release build: '${key}' is a Google sample ad id. Fix app.properties, or pass -PallowTestAdIds=true for a device test that is never published.")
    }
    return v
}
// Quote a value for buildConfigField; keys never contain quotes or backslashes, so refuse them rather than escape.
def q = { String v ->
    if (v.contains('"') || v.contains('\\')) {
        throw new GradleException("Value contains a quote or backslash, not allowed in a BuildConfig string")
    }
    return "\"${v}\"".toString()
}

// Google's public sample ids: safe for debug, never for release.
def GOOGLE_TEST_APP_ID = "ca-app-pub-3940256099942544~3347511713"
def GOOGLE_TEST_BANNER = "ca-app-pub-3940256099942544/6300978111"
def GOOGLE_TEST_INTERSTITIAL = "ca-app-pub-3940256099942544/1033173712"
def GOOGLE_TEST_APP_OPEN = "ca-app-pub-3940256099942544/9257395921"
def GOOGLE_TEST_REWARDED = "ca-app-pub-3940256099942544/5224354917"

android {
    namespace 'com.mckimquyen.reader'
    compileSdk 37
    defaultConfig {
        applicationId "com.mckimquyen.reader"
        minSdk 26
        //noinspection EditedTargetSdkVersion,OldTargetApi
        targetSdk 37
        versionCode 20261128
        versionName "2026.11.28"

        testInstrumentationRunner providers.gradleProperty("testRunner").getOrElse("androidx.test.runner.AndroidJUnitRunner")
        vectorDrawables {
            useSupportLibrary true
        }

        // Ship every locale we actually maintain a translation for (must exactly match each
        // res/values-<qualifier>/ directory name — a qualifier here that doesn't match a real
        // directory silently drops that locale's strings from the APK at build time; see
        // doc/task/done/FIX-16_i18n-resource-qualifier-mismatch_DONE.md for the bug this fixed).
        resourceConfigurations += [
                'en', 'ar', 'az', 'bg', 'ca', 'cs-rCZ', 'da', 'de-rDE', 'es-rES', 'eu-rES', 'fa',
                'fr-rFR', 'hi-rIN', 'hu', 'in-rID', 'it-rIT', 'iw', 'ja', 'kn', 'lzh', 'ml', 'my',
                'nb-rNO', 'nl', 'nn', 'pl-rPL', 'pt', 'pt-rBR', 'ro', 'ru-rRU', 'sl', 'sr', 'sv',
                'tr', 'uk', 'vi', 'zh-rCN', 'zh-rTW',
        ]

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true"
                ]
            }
        }
    }

//    lint {
//        baseline = file("lint-baseline.xml")
//    }

    flavorDimensions.add("channel")
    productFlavors {
        dev {
            dimension "channel"
        }
        prod {
            dimension "channel"
        }
    }
    signingConfigs {
        release {
            if (privateConfigDir != null && privateProps.getProperty("KEYSTORE_FILE") != null) {
                storeFile new File(privateConfigDir, privateProps.getProperty("KEYSTORE_FILE"))
                storePassword privateProps.getProperty("KS_STORE_PASSWORD")
                keyAlias privateProps.getProperty("KS_ALIAS")
                keyPassword privateProps.getProperty("KS_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            // Debug serves Google's sample ad units only. AppLovin has no sample units, so its ids come from the private file.
            buildConfigField "String", "APPLOVIN_SDK_KEY", q(privateProp("APPLOVIN_SDK_KEY"))
            buildConfigField "String", "APPLOVIN_BANNER_ID", q(privateProp("APPLOVIN_BANNER_ID"))
            buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", q(privateProp("APPLOVIN_INTERSTITIAL_ID"))
            buildConfigField "String", "APPLOVIN_APP_OPEN_ID", q(privateProp("APPLOVIN_APP_OPEN_ID"))
            buildConfigField "String", "APPLOVIN_REWARDED_ID", q(privateProp("APPLOVIN_REWARDED_ID"))
            buildConfigField "String", "ADMOB_BANNER_ID", q(GOOGLE_TEST_BANNER)
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", q(GOOGLE_TEST_INTERSTITIAL)
            buildConfigField "String", "ADMOB_APP_OPEN_ID", q(GOOGLE_TEST_APP_OPEN)
            buildConfigField "String", "ADMOB_REWARDED_ID", q(GOOGLE_TEST_REWARDED)
            manifestPlaceholders = [admobAppId: GOOGLE_TEST_APP_ID]
            buildConfigField "String", "ADMOB_TEST_DEVICE_IDS", q(privateProp("ADMOB_TEST_DEVICE_IDS"))
            buildConfigField "String", "VIP_KEY_SECRET", q(privateProp("VIP_INTEGRITY_SECRET"))
            buildConfigField "String", "VIP_TOKEN_PUBLIC_KEY", q(privateProp("VIP_TOKEN_PUBLIC_KEY"))
            buildConfigField "String", "VIP_REDEEM_CODES", q(privateProp("VIP_REDEEM_CODES"))
            buildConfigField "String", "PRIVACY_POLICY_URL", q(privateProp("PRIVACY_POLICY_URL"))
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "true"
            // Consent test: ./gradlew ... -PumpDebugGeography=EEA -PumpTestDeviceHashedIds=<hash UMP prints in logcat>. Debug only.
            buildConfigField "String", "UMP_DEBUG_GEOGRAPHY", q(providers.gradleProperty("umpDebugGeography").getOrElse(""))
            buildConfigField "String", "UMP_TEST_DEVICE_HASHED_IDS", q(providers.gradleProperty("umpTestDeviceHashedIds").getOrElse(""))
        }

        release {
            // Release has no fallback: a missing key stops the build (privateProp), a test id would ship zero revenue.
            buildConfigField "String", "APPLOVIN_SDK_KEY", q(privateProp("APPLOVIN_SDK_KEY"))
            buildConfigField "String", "APPLOVIN_BANNER_ID", q(privateProp("APPLOVIN_BANNER_ID"))
            buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", q(privateProp("APPLOVIN_INTERSTITIAL_ID"))
            buildConfigField "String", "APPLOVIN_APP_OPEN_ID", q(privateProp("APPLOVIN_APP_OPEN_ID"))
            buildConfigField "String", "APPLOVIN_REWARDED_ID", q(privateProp("APPLOVIN_REWARDED_ID"))
            buildConfigField "String", "ADMOB_BANNER_ID", q(releaseAdId("ADMOB_BANNER_ID"))
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", q(releaseAdId("ADMOB_INTERSTITIAL_ID"))
            buildConfigField "String", "ADMOB_APP_OPEN_ID", q(releaseAdId("ADMOB_APP_OPEN_ID"))
            buildConfigField "String", "ADMOB_REWARDED_ID", q(releaseAdId("ADMOB_REWARDED_ID"))
            manifestPlaceholders = [admobAppId: releaseAdId("ADMOB_APP_ID")]
            buildConfigField "String", "ADMOB_TEST_DEVICE_IDS", q(privateProp("ADMOB_TEST_DEVICE_IDS"))
            buildConfigField "String", "VIP_KEY_SECRET", q(privateProp("VIP_INTEGRITY_SECRET"))
            buildConfigField "String", "VIP_TOKEN_PUBLIC_KEY", q(privateProp("VIP_TOKEN_PUBLIC_KEY"))
            buildConfigField "String", "VIP_REDEEM_CODES", q(privateProp("VIP_REDEEM_CODES"))
            buildConfigField "String", "PRIVACY_POLICY_URL", q(privateProp("PRIVACY_POLICY_URL"))
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "true"
            // Never a region override in a release build, whatever gradle properties are set.
            buildConfigField "String", "UMP_DEBUG_GEOGRAPHY", "\"\""
            buildConfigField "String", "UMP_TEST_DEVICE_HASHED_IDS", "\"\""

            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            output.outputFileName = "RSS Cat Hub-${defaultConfig.versionName}-${gitCommitHash}.apk"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Single merged kotlinOptions block (was previously split into two)
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs = freeCompilerArgs + "-opt-in=kotlin.RequiresOptIn"
    }

    // Fix KAPT compatibility with newer Java versions
    tasks.withType(org.jetbrains.kotlin.gradle.internal.KaptGenerateStubsTask).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
    // Robolectric needs merged app resources to resolve R.string.* in unit tests
    testOptions {
        unitTests.includeAndroidResources = true
    }
    // MockK 1.13.5 uses ByteBuddy inline instrumentation. Load the already-resolved
    // ByteBuddy agent in the test JVM at startup; dynamic self-attach is disabled/unreliable
    // on some JBR/macOS setups and otherwise causes hundreds of unrelated test failures.
    tasks.matching { it.name == "testDevDebugUnitTest" }.configureEach {
        doFirst {
            def runtime = configurations.getByName("devDebugUnitTestRuntimeClasspath")
            def agent = runtime.files.find { it.name ==~ /byte-buddy-agent-.*\.jar/ }
            if (agent == null) throw new GradleException("MockK ByteBuddy agent missing from unit-test runtime")
            jvmArgs "-javaagent:${agent.absolutePath}"
        }
    }
    sourceSets.getByName("androidTest").assets.srcDir("$projectDir/schemas")
    buildFeatures {
        compose true
//        viewBinding true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "/META-INF/*.kotlin_module"
            excludes += "/META-INF/DEPENDENCIES"
            excludes += "/META-INF/LICENSE*"
            excludes += "/META-INF/NOTICE*"
            excludes += "/META-INF/*.properties"
            excludes += "/META-INF/*.version"
            excludes += "/*.properties"
            excludes += "DebugProbesKt.bin"
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

